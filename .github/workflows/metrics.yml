name: Update repo metrics

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stars and views
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          STARS=$(gh api "repos/$REPO" --jq '.stargazers_count')
          VIEWS=$(gh api "repos/$REPO/traffic/views" --jq '.count')
          TODAY_VIEWS=$(gh api "repos/$REPO/traffic/views" --jq '.views[-1].count')
          CLONES=$(gh api "repos/$REPO/traffic/clones" --jq '.count')
          echo "stars=$STARS" >> "$GITHUB_OUTPUT"
          echo "views=$VIEWS" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY_VIEWS" >> "$GITHUB_OUTPUT"
          echo "clones=$CLONES" >> "$GITHUB_OUTPUT"

      - name: Write metrics.json
        run: |
          cat > metrics.json <<EOF
          {
            "stars": ${{ steps.fetch.outputs.stars }},
            "views_total": ${{ steps.fetch.outputs.views }},
            "views_today": ${{ steps.fetch.outputs.today }},
            "clones_total": ${{ steps.fetch.outputs.clones }},
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          git diff --cached --quiet || git commit -m "Update repo metrics [skip ci]"
          git push
